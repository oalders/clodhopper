name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  precious:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      # precious (the lint orchestrator) and a version-pinned golangci-lint,
      # both installed as prebuilt binaries via ubi — no compile step. gofmt
      # and go vet ship with the Go toolchain set up above. Pinning both tools
      # keeps CI reproducible: a floating version can enable new linters (or
      # change command invocation / exit-code handling) that fail a
      # previously-clean tree.
      - uses: oalders/install-ubi-action@27bdce90e4b0e0a6c26023610ab03e375c6ed3e3 # v0.0.6
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          projects: |
            houseabsolute/precious --tag v0.11.0
            golangci/golangci-lint --tag v2.12.2

      - name: precious lint
        # Runs gofmt, go vet and golangci-lint — the exact checks the
        # pre-commit hook runs (see precious.toml), so local and CI agree.
        # CGO is on by default and gcc is preinstalled on ubuntu-latest, so the
        # go-sqlite3 package type-checks cleanly during go vet / golangci-lint.
        run: precious lint --all

      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
