name: release

# Releases are driven by tags. Use ./scripts/tag-release to bump, tag and push;
# the pushed tag triggers a full GoReleaser release. workflow_dispatch lets you
# run the pipeline by hand — as a snapshot dry-run when HEAD is not a tag.
# NOTE: dispatching on a tag ref publishes a REAL GitHub release (not a dry-run),
# since the snapshot branch below keys off ref_type != tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # needed for GoReleaser to create the GitHub release

jobs:
  goreleaser:
    # macOS runner so darwin CGO binaries link against the real Apple SDK via
    # clang. zig cannot link macOS CGO targets (no redistributable SDK -> missing
    # libresolv / system frameworks); it is still used to cross-compile the
    # linux and windows targets from this same runner. See .goreleaser.yaml.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so GoReleaser can build the changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # zig cross-compiles the linux and windows CGO targets (see .goreleaser.yaml).
      # NOTE: keep zig >= 0.14.0 — 0.13.0 has a CGO cross-compile regression
      # (ziglang/zig#20689), fixed in 0.14.0.
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      # darwin targets build with clang against this runner's macOS SDK.
      - name: Resolve macOS SDK path
        id: sdk
        run: echo "path=$(xcrun --show-sdk-path)" >> "$GITHUB_OUTPUT"

      - name: Determine GoReleaser args
        id: args
        # On a tag ref -> real release. Otherwise (manual dispatch on a branch)
        # -> snapshot build that uploads artifacts without publishing a release.
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "args=release --clean" >> "$GITHUB_OUTPUT"
          else
            echo "args=release --clean --snapshot" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ steps.args.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDK_PATH: ${{ steps.sdk.outputs.path }}

      # When dispatched manually (snapshot), there is no GitHub release to attach
      # to, so surface the built binaries as workflow artifacts instead.
      - name: Upload snapshot artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: clodhopper-snapshot
          path: dist/*
          retention-days: 7
