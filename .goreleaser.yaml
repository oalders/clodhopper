# GoReleaser configuration for clodhopper.
#
# clodhopper requires CGO (github.com/mattn/go-sqlite3), so cross-compilation
# is not free: every non-host target needs a matching C cross-compiler.
#
# The release runs on a macOS runner (see .github/workflows/release.yml):
#   - darwin (amd64+arm64): native clang against the runner's macOS SDK. zig
#     cannot link macOS CGO binaries — Apple's SDK isn't redistributable, so
#     zig lacks libresolv / system frameworks that Go's net + go-sqlite3 need.
#   - linux (amd64+arm64): `zig cc`, which ships libc stubs for every target and
#     cross-compiles cleanly from the macOS host.
#
# Windows is intentionally not a target: the serve write path uses Unix-only
# process-group primitives (syscall.Setpgid / syscall.Kill), and the tmux/merge-pr
# workflows it drives are Unix-only anyway.
version: 2

project_name: clodhopper

before:
  hooks:
    # Verify modules without mutating go.mod/go.sum during a release.
    - go mod download

builds:
  - id: clodhopper
    binary: clodhopper
    main: .
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }} # RFC3339 build timestamp (not the epoch .CommitDate)
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # Per-target C compiler. linux uses zig (libc stubs for every target);
    # darwin uses clang with -isysroot pointing at SDK_PATH (the macOS runner's
    # SDK, resolved via `xcrun --show-sdk-path` in the workflow) and -arch to
    # select the slice, so both macOS arches build natively against a real SDK.
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CC=zig cc -target x86_64-linux-gnu
          - CXX=zig c++ -target x86_64-linux-gnu
      - goos: linux
        goarch: arm64
        env:
          - CC=zig cc -target aarch64-linux-gnu
          - CXX=zig c++ -target aarch64-linux-gnu
      - goos: darwin
        goarch: amd64
        env:
          - CC=clang -arch x86_64 -isysroot {{ .Env.SDK_PATH }}
          - CXX=clang++ -arch x86_64 -isysroot {{ .Env.SDK_PATH }}
      - goos: darwin
        goarch: arm64
        env:
          - CC=clang -arch arm64 -isysroot {{ .Env.SDK_PATH }}
          - CXX=clang++ -arch arm64 -isysroot {{ .Env.SDK_PATH }}

archives:
  - id: clodhopper
    formats: [tar.gz]
    files:
      - README.md
      - CLAUDE.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # Mark as draft=false so a pushed tag publishes immediately.
  draft: false
  prerelease: auto
