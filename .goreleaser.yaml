# GoReleaser configuration for clodhopper.
#
# clodhopper requires CGO (github.com/mattn/go-sqlite3), so cross-compilation
# is not free: every non-host target needs a matching C cross-compiler. We use
# `zig cc` as a universal cross-compiler so a single Linux runner can build for
# linux, darwin, and windows on amd64 and arm64. See .github/workflows/release.yml.
version: 2

project_name: clodhopper

before:
  hooks:
    - go mod tidy

builds:
  - id: clodhopper
    binary: clodhopper
    main: .
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Per-target C cross-compiler. zig ships libc stubs for every target, which
    # is what makes CGO cross-compilation work from one runner.
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CC=zig cc -target x86_64-linux-gnu
          - CXX=zig c++ -target x86_64-linux-gnu
      - goos: linux
        goarch: arm64
        env:
          - CC=zig cc -target aarch64-linux-gnu
          - CXX=zig c++ -target aarch64-linux-gnu
      - goos: darwin
        goarch: amd64
        env:
          - CC=zig cc -target x86_64-macos-none
          - CXX=zig c++ -target x86_64-macos-none
      - goos: darwin
        goarch: arm64
        env:
          - CC=zig cc -target aarch64-macos-none
          - CXX=zig c++ -target aarch64-macos-none
      - goos: windows
        goarch: amd64
        env:
          - CC=zig cc -target x86_64-windows-gnu
          - CXX=zig c++ -target x86_64-windows-gnu
      - goos: windows
        goarch: arm64
        env:
          - CC=zig cc -target aarch64-windows-gnu
          - CXX=zig c++ -target aarch64-windows-gnu

archives:
  - id: clodhopper
    formats: [tar.gz]
    # Use zip for Windows so it unpacks cleanly there.
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - CLAUDE.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  # Mark as draft=false so a pushed tag publishes immediately.
  draft: false
  prerelease: auto
